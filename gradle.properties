# 通用构建参数（跨平台，Windows / macOS / Linux 都一样）
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 本工程没有引入 AndroidX 依赖，关闭它可以少解析一堆元数据
android.useAndroidX=false

kotlin.code.style=official

# Windows + 企业代理的机器如果遇到 PKIX path building failed，
# 不要改这个文件（会破坏跨平台兼容），而是在
#   <GRADLE_USER_HOME>/gradle.properties
# 里加一行：
#   org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=WINDOWS-ROOT
